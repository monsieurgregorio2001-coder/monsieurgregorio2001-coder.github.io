name: refresh-evidence

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull each room's live evidence.json
        run: node scripts/evidence-pull.mjs
      - name: Rebuild
        run: node scripts/build.mjs
      - name: Open the Refresh evidence PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then echo "Evidence unchanged."; exit 0; fi
          branch="evidence/refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "Refresh evidence"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh evidence" --body "Snapshots of each room's live evidence.json, and the pages rebuilt from them." || gh pr edit "$branch" --body "Snapshots of each room's live evidence.json, and the pages rebuilt from them."
