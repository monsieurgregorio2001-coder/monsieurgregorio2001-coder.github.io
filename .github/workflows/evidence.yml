name: refresh-evidence

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull each room's live evidence.json
        run: node scripts/evidence-pull.mjs
      - name: Rebuild
        run: node scripts/build.mjs
      - name: Open the Refresh evidence PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then echo "Evidence unchanged."; exit 0; fi
          branch="evidence/refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "Refresh evidence"
          git push --force origin "$branch"
          body="Snapshots of each room's live evidence.json, and the pages rebuilt from them."
          # Only reuse an OPEN pull request. Looking up by branch name alone finds
          # old merged ones (#20), so a failed create used to pass silently.
          open_pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body "$body"
          elif ! gh pr create --base main --head "$branch" --title "Refresh evidence" --body "$body"; then
            echo "::error::Could not open the Refresh evidence pull request. If the log says Actions is not permitted to create pull requests, turn on Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
            exit 1
          fi
