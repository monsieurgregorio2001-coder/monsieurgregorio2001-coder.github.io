name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install tooling
        working-directory: scripts
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: scripts
        run: npx playwright install --with-deps chromium
      - name: Build output matches committed HTML
        run: |
          node scripts/build.mjs
          git diff --exit-code -- index.html 'work/**/index.html'
      - name: html-validate
        run: scripts/node_modules/.bin/html-validate index.html 404.html work/*/index.html lab/doorway/*/index.html house/*/demo.html
      - name: House (immutability, token lint, budgets, room contract and CLS on the demo)
        run: node scripts/check-house.mjs
      - name: axe (hub and case pages, light and dark)
        run: node scripts/check-axe.mjs
      - name: Link check
        run: node scripts/check-links.mjs
