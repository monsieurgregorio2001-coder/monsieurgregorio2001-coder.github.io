name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation and project registry
        run: python3 scripts/check-docs.py
      - name: Check the validator's failure cases
        run: python3 -m unittest discover -s scripts -p 'test_check_docs.py'
